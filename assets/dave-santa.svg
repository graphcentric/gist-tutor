<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" role="img" aria-labelledby="title desc">
  <title id="title">Dave McComb as Santa Claus</title>
  <desc id="desc">Festive stylised illustration of a friendly older gentleman as Santa Claus, with glasses and a scroll labelled gist — Dave McComb of Semantic Arts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a4d36"/>
      <stop offset="100%" stop-color="#0b2e1f"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c41e3a"/>
      <stop offset="100%" stop-color="#8b1228"/>
    </linearGradient>
  </defs>
  <!-- soft panel -->
  <rect x="8" y="8" width="204" height="224" rx="22" fill="url(#bg)"/>
  <circle cx="48" cy="42" r="4" fill="#d4a017" opacity="0.7"/>
  <circle cx="176" cy="56" r="3" fill="#f5f0e1" opacity="0.55"/>
  <circle cx="190" cy="180" r="2.5" fill="#d4a017" opacity="0.6"/>
  <!-- holly sprig left -->
  <g transform="translate(22,28)">
    <ellipse cx="10" cy="14" rx="9" ry="5" fill="#2f7a45" transform="rotate(-35 10 14)"/>
    <ellipse cx="18" cy="10" rx="9" ry="5" fill="#3a9154" transform="rotate(20 18 10)"/>
    <ellipse cx="14" cy="20" rx="8" ry="4.5" fill="#246b38" transform="rotate(-5 14 20)"/>
    <circle cx="14" cy="14" r="2.4" fill="#c41e3a"/>
    <circle cx="19" cy="17" r="2.1" fill="#c41e3a"/>
    <circle cx="10" cy="18" r="2" fill="#a81830"/>
  </g>
  <!-- holly sprig right -->
  <g transform="translate(168,26)">
    <ellipse cx="14" cy="12" rx="9" ry="5" fill="#2f7a45" transform="rotate(30 14 12)"/>
    <ellipse cx="8" cy="18" rx="8" ry="4.5" fill="#3a9154" transform="rotate(-25 8 18)"/>
    <circle cx="12" cy="14" r="2.3" fill="#c41e3a"/>
    <circle cx="17" cy="16" r="2" fill="#a81830"/>
  </g>
  <!-- hat -->
  <path d="M58 78 C70 38, 150 38, 162 78 L155 86 C140 58, 80 58, 65 86 Z" fill="url(#hat)"/>
  <ellipse cx="168" cy="52" rx="14" ry="12" fill="#f5f0e1"/>
  <ellipse cx="168" cy="52" rx="8" ry="7" fill="#fff" opacity="0.55"/>
  <!-- hat brim fur -->
  <ellipse cx="110" cy="84" rx="58" ry="14" fill="#f5f0e1"/>
  <ellipse cx="110" cy="82" rx="50" ry="8" fill="#fff" opacity="0.35"/>
  <!-- head -->
  <ellipse cx="110" cy="118" rx="46" ry="44" fill="#f0c9a0"/>
  <!-- glasses -->
  <circle cx="92" cy="112" r="12" fill="none" stroke="#3a2f28" stroke-width="2.2"/>
  <circle cx="128" cy="112" r="12" fill="none" stroke="#3a2f28" stroke-width="2.2"/>
  <path d="M104 112 H116" stroke="#3a2f28" stroke-width="2"/>
  <path d="M80 110 H72" stroke="#3a2f28" stroke-width="2"/>
  <path d="M140 110 H148" stroke="#3a2f28" stroke-width="2"/>
  <!-- eyes -->
  <circle cx="92" cy="113" r="2.4" fill="#2a221c"/>
  <circle cx="128" cy="113" r="2.4" fill="#2a221c"/>
  <!-- brows -->
  <path d="M82 102 Q92 98 102 102" fill="none" stroke="#5a4638" stroke-width="2" stroke-linecap="round"/>
  <path d="M118 102 Q128 98 138 102" fill="none" stroke="#5a4638" stroke-width="2" stroke-linecap="round"/>
  <!-- nose -->
  <ellipse cx="110" cy="122" rx="5" ry="4" fill="#e0a888"/>
  <!-- smile -->
  <path d="M96 132 Q110 142 124 132" fill="none" stroke="#8b4a3a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- beard -->
  <path d="M68 128 C72 170, 90 188, 110 192 C130 188, 148 170, 152 128 C140 148, 128 156, 110 158 C92 156, 80 148, 68 128 Z" fill="#f5f0e1"/>
  <path d="M86 148 Q110 168 134 148" fill="none" stroke="#e8e0d0" stroke-width="3" opacity="0.7"/>
  <!-- mustache -->
  <path d="M90 128 Q100 136 110 128 Q120 136 130 128" fill="#f5f0e1" stroke="#e0d8c8" stroke-width="1"/>
  <!-- coat / shoulders -->
  <path d="M48 210 C58 178, 78 168, 110 168 C142 168, 162 178, 172 210 Z" fill="url(#hat)"/>
  <path d="M100 168 V210" stroke="#f5f0e1" stroke-width="8" stroke-linecap="round"/>
  <circle cx="110" cy="186" r="6" fill="#d4a017"/>
  <!-- scroll -->
  <g transform="translate(148,168) rotate(-12)">
    <rect x="0" y="0" width="44" height="28" rx="3" fill="#f3e6c8" stroke="#c4a86a" stroke-width="1.5"/>
    <rect x="-3" y="-2" width="6" height="32" rx="2" fill="#e8d4a8"/>
    <rect x="41" y="-2" width="6" height="32" rx="2" fill="#e8d4a8"/>
    <text x="22" y="18" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#1a3d2e">gist</text>
  </g>
  <!-- caption ribbon -->
  <rect x="28" y="208" width="164" height="18" rx="9" fill="#0b2e1f" opacity="0.85"/>
  <text x="110" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f5f0e1" letter-spacing="0.04em">DAVE McCOMB · SEMANTIC ARTS</text>
</svg>
